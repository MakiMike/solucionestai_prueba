# Permisos temporales exclusivos de la prueba. No modifica deny-all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prueba-carga-salida
  namespace: tienda-prod
spec:
  podSelector:
    matchLabels:
      app: prueba-carga
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 8080

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prueba-carga-entrada
  namespace: tienda-prod
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prueba-carga
      ports:
        - protocol: TCP
          port: 8080

