<text x="55" y="71" font-family="Arial" font-size="36" font-weight="700" fill="#263444">1  Arquitectura de la aplicación</text>
<text x="55" y="110" font-family="Arial" font-size="20" font-weight="400" fill="#263444">Responsabilidades y protocolos · La interfaz actual se renderiza en el servidor</text>
<text x="55" y="1114" font-family="Arial" font-size="19" font-weight="400" fill="#263444">Tienda de ropa alternativa · Referencia para redibujar · Diseño previsto, no evidencia de despliegue</text>
