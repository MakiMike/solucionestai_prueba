<text x="30" y="680" font-family="Arial" font-size="20" font-weight="400" fill="#243247">La ubicación de las réplicas de aplicación y de las BD coincide con la consulta del corte.</text>
<text x="30" y="720" font-family="Arial" font-size="20" font-weight="400" fill="#243247">Los Pods de plataforma pueden reprogramarse; las bases locales quedan ligadas al volumen.</text>
<text x="30" y="767" font-family="Arial" font-size="22" font-weight="700" fill="#243247">Límites: host único, control plane único, NFS único y una instancia por motor.</text>
