{
  "apiVersion": "autoscaling/v2",
  "kind": "HorizontalPodAutoscaler",
  "metadata": {
    "name": "backend"
  },
  "spec": {
    "scaleTargetRef": {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "name": "backend"
    },
    "minReplicas": 2,
    "maxReplicas": 6,
    "metrics": [
      {
        "type": "Resource",
        "resource": {
          "name": "cpu",
          "target": {
            "type": "Utilization",
            "averageUtilization": 70
          }
        }
      }
    ]
  }
}
---
{
  "apiVersion": "policy/v1",
  "kind": "PodDisruptionBudget",
  "metadata": {
    "name": "frontend"
  },
  "spec": {
    "minAvailable": 1,
    "selector": {
      "matchLabels": {
        "app": "frontend"
      }
    }
  }
}
---
{
  "apiVersion": "policy/v1",
  "kind": "PodDisruptionBudget",
  "metadata": {
    "name": "backend"
  },
  "spec": {
    "minAvailable": 1,
    "selector": {
      "matchLabels": {
        "app": "backend"
      }
    }
  }
}
