{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "namespace": "tienda-dev",
  "resources": [
    "../../base",
    "namespace.yaml"
  ],
  "patches": [
    {
      "target": {
        "kind": "ConfigMap",
        "name": "tienda-config"
      },
      "patch": "[\n  {\n    \"op\": \"replace\",\n    \"path\": \"/data/APP_BASE_URL\",\n    \"value\": \"https://tienda-dev.test:8443/\"\n  }\n]\n"
    },
    {
      "target": {
        "kind": "Ingress",
        "name": "tienda"
      },
      "patch": "[\n  {\n    \"op\": \"replace\",\n    \"path\": \"/spec/tls/0/hosts/0\",\n    \"value\": \"tienda-dev.test\"\n  },\n  {\n    \"op\": \"replace\",\n    \"path\": \"/spec/rules/0/host\",\n    \"value\": \"tienda-dev.test\"\n  }\n]\n"
    }
  ]
}
