{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "mongo-restore"
  },
  "spec": {
    "automountServiceAccountToken": false,
    "securityContext": {
      "fsGroup": 999,
      "seccompProfile": {
        "type": "RuntimeDefault"
      }
    },
    "containers": [
      {
        "name": "mongo",
        "image": "mongo:8.0.14",
        "imagePullPolicy": "IfNotPresent",
        "securityContext": {
          "runAsNonRoot": true,
          "allowPrivilegeEscalation": false,
          "readOnlyRootFilesystem": true,
          "capabilities": {
            "drop": [
              "ALL"
            ]
          },
          "seccompProfile": {
            "type": "RuntimeDefault"
          },
          "runAsUser": 999
        },
        "resources": {
          "requests": {
            "cpu": "100m",
            "memory": "128Mi"
          },
          "limits": {
            "cpu": "1",
            "memory": "768Mi"
          }
        },
        "ports": [
          {
            "containerPort": 27017
          }
        ],
        "env": [
          {
            "value": "/tmp",
            "name": "HOME"
          },
          {
            "value": "restore_owner",
            "name": "MONGO_INITDB_ROOT_USERNAME"
          },
          {
            "valueFrom": {
              "secretKeyRef": {
                "key": "password",
                "name": "restore-credentials"
              }
            },
            "name": "MONGO_INITDB_ROOT_PASSWORD"
          }
        ],
        "readinessProbe": {
          "tcpSocket": {
            "port": 27017
          },
          "initialDelaySeconds": 10
        },
        "startupProbe": {
          "tcpSocket": {
            "port": 27017
          },
          "periodSeconds": 5,
          "failureThreshold": 60
        },
        "livenessProbe": {
          "tcpSocket": {
            "port": 27017
          },
          "initialDelaySeconds": 30,
          "periodSeconds": 15
        },
        "volumeMounts": [
          {
            "name": "data",
            "mountPath": "/data/db"
          },
          {
            "name": "tmp",
            "mountPath": "/tmp"
          },
          {
            "name": "runtime",
            "mountPath": "/data/configdb"
          }
        ]
      }
    ],
    "volumes": [
      {
        "name": "tmp",
        "emptyDir": {}
      },
      {
        "name": "runtime",
        "emptyDir": {}
      },
      {
        "name": "data",
        "persistentVolumeClaim": {
          "claimName": "mongo-datos"
        }
      }
    ]
  }
}
