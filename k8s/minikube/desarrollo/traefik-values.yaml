deployment:
  replicas: 1
service:
  spec:
    type: ClusterIP
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik
providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: false
  kubernetesGateway:
    enabled: false
ingressRoute:
  dashboard:
    enabled: false
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
log:
  level: INFO
accessLog:
  enabled: true
