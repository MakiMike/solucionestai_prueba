{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "loki-datos",
        "namespace": "monitoreo"
      },
      "spec": {
        "storageClassName": "csi-hostpath-sc",
        "accessModes": [
          "ReadWriteOnce"
        ],
        "resources": {
          "requests": {
            "storage": "1Gi"
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "ConfigMap",
      "metadata": {
        "name": "loki-config",
        "namespace": "monitoreo"
      },
      "data": {
        "loki.yaml": "auth_enabled: false\nserver:\n  http_listen_port: 3100\ncommon:\n  path_prefix: /loki\n  replication_factor: 1\n  ring:\n    kvstore:\n      store: inmemory\n  storage:\n    filesystem:\n      chunks_directory: /loki/chunks\n      rules_directory: /loki/rules\nschema_config:\n  configs:\n    - from: 2024-01-01\n      store: tsdb\n      object_store: filesystem\n      schema: v13\n      index:\n        prefix: index_\n        period: 24h\ncompactor:\n  working_directory: /loki/compactor\n  retention_enabled: true\n  delete_request_store: filesystem\nlimits_config:\n  retention_period: 24h\n  ingestion_rate_mb: 2\n  ingestion_burst_size_mb: 4\n  max_query_parallelism: 2\n  max_global_streams_per_user: 1000\nanalytics:\n  reporting_enabled: false\n"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "loki-tienda",
        "namespace": "monitoreo"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "loki-tienda"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "loki-tienda"
            }
          },
          "spec": {
            "automountServiceAccountToken": false,
            "securityContext": {
              "fsGroup": 10001,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "containers": [
              {
                "name": "loki-tienda",
                "image": "grafana/loki:3.7.9",
                "args": [
                  "-config.file=/etc/loki/loki.yaml"
                ],
                "ports": [
                  {
                    "name": "http",
                    "containerPort": 3100
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "20m",
                    "memory": "96Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "384Mi"
                  }
                },
                "securityContext": {
                  "runAsNonRoot": true,
                  "runAsUser": 10001,
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "volumeMounts": [
                  {
                    "name": "config",
                    "mountPath": "/etc/loki",
                    "readOnly": true
                  },
                  {
                    "name": "datos",
                    "mountPath": "/loki"
                  },
                  {
                    "name": "tmp",
                    "mountPath": "/tmp"
                  }
                ],
                "readinessProbe": {
                  "httpGet": {
                    "path": "/ready",
                    "port": "http"
                  },
                  "initialDelaySeconds": 15,
                  "periodSeconds": 10
                }
              }
            ],
            "volumes": [
              {
                "name": "config",
                "configMap": {
                  "name": "loki-config"
                }
              },
              {
                "name": "datos",
                "persistentVolumeClaim": {
                  "claimName": "loki-datos"
                }
              },
              {
                "name": "tmp",
                "emptyDir": {}
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "loki-tienda",
        "namespace": "monitoreo",
        "labels": {
          "app": "loki-tienda"
        }
