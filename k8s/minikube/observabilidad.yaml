        "template": {
          "metadata": {
            "labels": {
              "app": "alloy-logs"
            }
          },
          "spec": {
            "automountServiceAccountToken": true,
            "securityContext": {
              "fsGroup": 473,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "containers": [
              {
                "name": "alloy-logs",
                "image": "grafana/alloy:v1.21.3",
                "args": [
                  "run",
                  "/etc/alloy/config.alloy",
                  "--storage.path=/var/lib/alloy",
                  "--server.http.listen-addr=0.0.0.0:12345"
                ],
                "ports": [
                  {
                    "name": "http",
                    "containerPort": 12345
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "20m",
                    "memory": "32Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "192Mi"
                  }
                },
                "securityContext": {
                  "runAsNonRoot": true,
                  "runAsUser": 473,
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "volumeMounts": [
                  {
                    "name": "config",
                    "mountPath": "/etc/alloy",
                    "readOnly": true
                  },
                  {
                    "name": "datos",
                    "mountPath": "/var/lib/alloy"
                  },
                  {
                    "name": "tmp",
                    "mountPath": "/tmp"
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "config",
                "configMap": {
                  "name": "alloy-config"
                }
              },
              {
                "name": "datos",
                "emptyDir": {}
              },
              {
                "name": "tmp",
                "emptyDir": {}
              }
            ],
            "serviceAccountName": "alloy-logs"
          }
        }
      }
