apiVersion: v1
kind: ServiceAccount
metadata:
  name: tienda-observador
  namespace: tienda-prod
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tienda-operador
  namespace: tienda-prod
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tienda-consulta
  namespace: tienda-prod
rules:
  - apiGroups: ['']
    resources: [pods, services, persistentvolumeclaims, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tienda-ajustar-replicas
  namespace: tienda-prod
rules:
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [frontend, backend]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tienda-consulta
  namespace: tienda-prod
subjects:
  - kind: ServiceAccount
    name: tienda-observador
    namespace: tienda-prod
  - kind: ServiceAccount
    name: tienda-operador
    namespace: tienda-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tienda-consulta
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tienda-ajustar-replicas
  namespace: tienda-prod
subjects:
  - kind: ServiceAccount
    name: tienda-operador
    namespace: tienda-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tienda-ajustar-replicas
