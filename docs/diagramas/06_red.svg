<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="white"/>
<text x="28" y="50" font-family="Arial" font-size="30" font-weight="700" fill="#243247">6. Red y recorrido de una solicitud</text>
<rect x="25" y="85" width="1150" height="95" rx="10" fill="#edf2f7" stroke="#91a3b7" stroke-width="2"/>
<text x="535.0" y="117" font-family="Arial" font-size="22" font-weight="700" fill="#243247">LAN de casa</text>
<text x="197.5" y="153" font-family="Arial" font-size="21" font-weight="400" fill="#243247">Gateway 192.168.100.1 | PC Ethernet 192.168.100.3 | Sin VLAN ni VPN configurada</text>
<rect x="25" y="230" width="550" height="145" rx="10" fill="#e9f0fa" stroke="#91a3b7" stroke-width="2"/>
<text x="122.5" y="263" font-family="Arial" font-size="23" font-weight="700" fill="#243247">Windows Firewall + port-forward</text>
<text x="163.0" y="299" font-family="Arial" font-size="22" font-weight="400" fill="#243247">Prod: 127.0.0.1 y LAN :9443</text>
<text x="179.5" y="328" font-family="Arial" font-size="22" font-weight="400" fill="#243247">Dev: solo 127.0.0.1:9444</text>
<text x="160.0" y="357" font-family="Arial" font-size="22" font-weight="400" fill="#243247">Grafana: solo 127.0.0.1:3000</text>
<rect x="650" y="230" width="525" height="145" rx="10" fill="#e9f0fa" stroke="#91a3b7" stroke-width="2"/>
<text x="791.015625" y="263" font-family="Arial" font-size="23" font-weight="700" fill="#243247">Docker Desktop / NAT</text>
<text x="784.0" y="299" font-family="Arial" font-size="22" font-weight="400" fill="#243247">Red prod: 192.168.58.0/24</text>
<text x="788.0" y="328" font-family="Arial" font-size="22" font-weight="400" fill="#243247">Red dev: 192.168.49.0/24</text>
<text x="763.0" y="357" font-family="Arial" font-size="22" font-weight="400" fill="#243247">API: puertos locales de Docker</text>
<polyline points="575,300 650,300" fill="none" stroke="#425d78" stroke-width="3"/>
<polygon points="650,300 639.4690092573155,305.75310646325045 639.4690092573155,294.24689353674955" fill="#425d78"/>
<rect x="25" y="440" width="550" height="160" rx="10" fill="#e9f0fa" stroke="#91a3b7" stroke-width="2"/>
<text x="159.5" y="473" font-family="Arial" font-size="23" font-weight="700" fill="#243247">Clústeres independientes</text>
<text x="203.0" y="509" font-family="Arial" font-size="22" font-weight="400" fill="#243247">Pods: 10.244.0.0/16</text>
<text x="192.0" y="538" font-family="Arial" font-size="22" font-weight="400" fill="#243247">Services: 10.96.0.0/12</text>
<text x="131.0" y="567" font-family="Arial" font-size="22" font-weight="400" fill="#243247">Calico: IP-in-IP; DNS UDP/TCP 53</text>
<rect x="650" y="440" width="525" height="160" rx="10" fill="#f0eafb" stroke="#91a3b7" stroke-width="2"/>
<text x="804.5" y="473" font-family="Arial" font-size="23" font-weight="700" fill="#243247">Ruta de producción</text>
<text x="759.0078125" y="509" font-family="Arial" font-size="22" font-weight="400" fill="#243247">TLS → Traefik → frontend:8080</text>
<text x="787.0" y="538" font-family="Arial" font-size="22" font-weight="400" fill="#243247">FastCGI → backend:9000</text>
<text x="757.5" y="567" font-family="Arial" font-size="22" font-weight="400" fill="#243247">TLS → PG:5432 / Mongo:27017</text>
<text x="30" y="671" font-family="Arial" font-size="21" font-weight="400" fill="#243247">Exporters: PG 9187 y Mongo 9216; NFS TCP 2049. Acceso interno por políticas explícitas.</text>
<text x="30" y="715" font-family="Arial" font-size="20" font-weight="400" fill="#243247">Los mismos CIDR de Pods/Services se repiten en redes Docker separadas; no se enrutan entre sí.</text>
<text x="30" y="762" font-family="Arial" font-size="22" font-weight="700" fill="#243247">No hay VIP externa ni balanceador de nube. El port-forward depende de la PC y de la API.</text>
<text x="28" y="809" font-family="Arial" font-size="17" font-weight="400" fill="#243247">TSkull-Shirt | Minikube | Corte: 31-10-2026 | Diagrama, no captura de pantalla</text></svg>