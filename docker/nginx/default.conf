server {
    listen 8080;
    server_name _;
    root /var/www/html;
    client_max_body_size 4m;
    location = /healthz { access_log off; return 200 'ok'; }
    location ~ \.(php|env)$ { return 404; }
    location ~ ^/(assets|DataTables)/ { try_files $uri =404; }
    location /uploads/ { try_files $uri =404; }
    location ~ ^/(application|system|vendor|bin|database|tests|docker|k8s|tmp|output)/ { deny all; }
    location ~ /\. { deny all; }
    location = /health/live { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/html/public/health.php; fastcgi_param QUERY_STRING ""; fastcgi_pass backend:9000; }
    location = /health/ready { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/html/public/health.php; fastcgi_param QUERY_STRING ready=1; fastcgi_pass backend:9000; }
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_pass backend:9000;
    }
}
