---
{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "Ingress",
  "metadata": {
    "name": "tienda"
  },
  "spec": {
    "ingressClassName": "traefik",
    "tls": [
      {
        "hosts": [
          "tienda-dev.test"
        ],
        "secretName": "tienda-tls"
      }
    ],
    "rules": [
      {
        "host": "tienda-dev.test",
        "http": {
          "paths": [
            {
              "path": "/",
              "pathType": "Prefix",
              "backend": {
                "service": {
                  "name": "frontend",
                  "port": {
                    "number": 8080
                  }
                }
              }
            }
