{
  "apiVersion": "v1",
  "kind": "ServiceAccount",
  "metadata": {
    "name": "tienda"
  },
  "automountServiceAccountToken": false
}
---
{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "tienda-config"
  },
  "data": {
    "CI_ENV": "production",
    "APP_BASE_URL": "https://tienda-dev.test:8443/",
    "APP_SESSION_DRIVER": "database",
    "APP_COOKIE_SECURE": "true",
    "DB_HOST": "postgres",
    "DB_PORT": "5432",
    "DB_DATABASE": "tienda",
    "DB_USERNAME": "tienda_app",
    "DB_SSLMODE": "prefer",
    "MONGO_DATABASE": "tienda",
    "HOME": "/tmp"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "database-init"
  },
  "data": {
    "postgres.sh": "#!/bin/sh\nset -eu\npsql -v ON_ERROR_STOP=1 --username \"$POSTGRES_USER\" --dbname \"$POSTGRES_DB\" --set=app_password=\"$DB_PASSWORD\" <<'SQL'\nSELECT format('CREATE ROLE tienda_app LOGIN PASSWORD %L', :'app_password') WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='tienda_app') \\gexec\nSQL\n",
    "mongo.js": "const target = db.getSiblingDB(process.env.MONGO_DATABASE || 'tienda');\nif (!target.getUser('tienda_app')) {\n  target.createUser({user:'tienda_app',pwd:process.env.MONGO_APP_PASSWORD,roles:[{role:'readWrite',db:target.getName()}]});\n}\n"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "PersistentVolumeClaim",
  "metadata": {
    "name": "uploads"
  },
  "spec": {
    "accessModes": [
      "ReadWriteOnce"
    ],
    "resources": {
      "requests": {
        "storage": "2Gi"
      }
    }
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "backend"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "backend"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "backend"
        }
      },
      "spec": {
        "serviceAccountName": "tienda",
        "automountServiceAccountToken": false,
        "securityContext": {
          "fsGroup": 33,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "backend",
            "image": "tienda-backend:0.1.1",
            "imagePullPolicy": "IfNotPresent",
            "securityContext": {
              "runAsNonRoot": true,
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "seccompProfile": {
                "type": "RuntimeDefault"
              },
              "runAsUser": 33
            },
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "512Mi"
              }
            },
            "ports": [
              {
                "containerPort": 9000
              }
            ],
            "envFrom": [
              {
                "configMapRef": {
                  "name": "tienda-config"
                }
              }
            ],
            "env": [
              {
                "name": "DB_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "tienda-secrets",
                    "key": "DB_PASSWORD"
                  }
                }
              },
              {
                "name": "MONGO_URI",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "tienda-secrets",
                    "key": "MONGO_URI"
                  }
                }
              },
              {
                "name": "APP_ENCRYPTION_KEY",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "tienda-secrets",
                    "key": "APP_ENCRYPTION_KEY"
                  }
                }
              }
            ],
            "livenessProbe": {
              "tcpSocket": {
                "port": 9000
              },
              "initialDelaySeconds": 10,
              "periodSeconds": 15
            },
            "readinessProbe": {
              "exec": {
                "command": [
                  "php",
                  "-r",
                  "require 'application/services/TiendaConnection.php'; TiendaConnection::open()->query('SELECT evento_id FROM tienda_outbox LIMIT 0');"
                ]
              },
              "initialDelaySeconds": 5,
              "timeoutSeconds": 5
            },
            "volumeMounts": [
              {
                "name": "uploads",
                "mountPath": "/var/www/html/uploads",
                "readOnly": false
              },
              {
                "name": "tmp",
                "mountPath": "/tmp"
              },
              {
                "name": "logs",
                "mountPath": "/var/www/html/application/logs"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "uploads",
            "persistentVolumeClaim": {
              "claimName": "uploads"
            }
          },
          {
            "name": "tmp",
            "emptyDir": {}
          },
          {
            "name": "logs",
            "emptyDir": {}
          }
        ],
        "initContainers": [
          {
            "name": "preparar-fotos",
            "image": "tienda-backend:0.1.1",
            "imagePullPolicy": "IfNotPresent",
            "command": [
              "sh",
              "-ec",
              "mkdir -p /var/www/html/uploads/playeras; chmod 2770 /var/www/html/uploads/playeras"
            ],
            "securityContext": {
              "readOnlyRootFilesystem": true,
              "allowPrivilegeEscalation": false,
              "runAsNonRoot": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "runAsUser": 33,
              "runAsGroup": 33
            },
            "resources": {
              "limits": {
                "cpu": "100m",
                "memory": "64Mi"
              },
              "requests": {
                "cpu": "10m",
                "memory": "16Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "uploads",
                "mountPath": "/var/www/html/uploads"
              }
            ]
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "backend"
  },
  "spec": {
    "selector": {
      "app": "backend"
    },
    "ports": [
      {
        "port": 9000,
        "targetPort": 9000
      }
    ]
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "frontend"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "frontend"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "frontend"
        }
      },
      "spec": {
        "serviceAccountName": "tienda",
        "automountServiceAccountToken": false,
        "securityContext": {
          "fsGroup": 33,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "frontend",
            "image": "tienda-frontend:0.1.0",
            "imagePullPolicy": "IfNotPresent",
            "securityContext": {
              "runAsNonRoot": true,
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "seccompProfile": {
                "type": "RuntimeDefault"
              },
              "runAsUser": 101
            },
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "512Mi"
              }
            },
            "ports": [
              {
                "containerPort": 8080
              }
            ],
            "livenessProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": 8080
              },
              "initialDelaySeconds": 5
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/health/ready",
                "port": 8080
              },
              "timeoutSeconds": 5
            },
            "volumeMounts": [
              {
                "name": "uploads",
                "mountPath": "/var/www/html/uploads",
                "readOnly": true
              },
              {
                "name": "tmp",
                "mountPath": "/tmp"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "uploads",
            "persistentVolumeClaim": {
              "claimName": "uploads"
            }
          },
          {
            "name": "tmp",
            "emptyDir": {}
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "frontend"
  },
  "spec": {
    "selector": {
      "app": "frontend"
    },
    "ports": [
      {
        "port": 8080,
        "targetPort": 8080
      }
    ]
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "postgres"
  },
  "spec": {
    "serviceName": "postgres",
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "postgres"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "postgres"
        }
      },
      "spec": {
        "serviceAccountName": "tienda",
        "automountServiceAccountToken": false,
        "securityContext": {
          "fsGroup": 999,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "postgres",
            "image": "postgres:17.6-bookworm",
            "imagePullPolicy": "IfNotPresent",
            "securityContext": {
              "runAsNonRoot": true,
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "seccompProfile": {
                "type": "RuntimeDefault"
              },
              "runAsUser": 999
            },
            "resources": {
              "requests": {
                "cpu": "250m",
                "memory": "256Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "1Gi"
              }
            },
            "ports": [
              {
                "containerPort": 5432
              }
            ],
            "env": [
              {
                "name": "POSTGRES_DB",
                "value": "tienda"
              },
              {
                "name": "POSTGRES_USER",
                "value": "tienda_owner"
              },
              {
                "name": "POSTGRES_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "tienda-secrets",
                    "key": "DB_OWNER_PASSWORD"
                  }
                }
              },
              {
                "name": "DB_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "tienda-secrets",
                    "key": "DB_PASSWORD"
                  }
                }
              },
              {
                "name": "PGDATA",
                "value": "/var/lib/postgresql/data/pgdata"
              }
            ],
            "readinessProbe": {
              "exec": {
                "command": [
                  "pg_isready",
                  "-U",
                  "tienda_owner",
                  "-d",
                  "tienda"
                ]
              },
              "initialDelaySeconds": 5
            },
            "startupProbe": {
              "tcpSocket": {
                "port": 5432
              },
              "periodSeconds": 5,
              "failureThreshold": 60
            },
            "livenessProbe": {
              "tcpSocket": {
                "port": 5432
              },
              "initialDelaySeconds": 30,
              "periodSeconds": 15
            },
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/var/lib/postgresql/data"
              },
              {
                "name": "init",
                "mountPath": "/docker-entrypoint-initdb.d/10-app.sh",
                "subPath": "postgres.sh",
                "readOnly": true
              },
              {
                "name": "tmp",
                "mountPath": "/tmp"
              },
              {
                "name": "runtime",
                "mountPath": "/var/run/postgresql"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "init",
            "configMap": {
              "name": "database-init",
              "defaultMode": 365
            }
          },
          {
            "name": "tmp",
            "emptyDir": {}
          },
          {
            "name": "runtime",
            "emptyDir": {}
          }
        ]
      }
    },
    "volumeClaimTemplates": [
      {
        "metadata": {
          "name": "data"
        },
        "spec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "resources": {
            "requests": {
              "storage": "5Gi"
            }
          }
        }
      }
    ]
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "postgres"
  },
  "spec": {
    "selector": {
      "app": "postgres"
    },
    "ports": [
      {
        "port": 5432,
        "targetPort": 5432
      }
    ]
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "mongo"
  },
  "spec": {
    "serviceName": "mongo",
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "mongo"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "mongo"
        }
      },
      "spec": {
        "serviceAccountName": "tienda",
        "automountServiceAccountToken": false,
        "securityContext": {
          "fsGroup": 999,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "mongo",
            "image": "mongo:8.0.14",
            "imagePullPolicy": "IfNotPresent",
            "securityContext": {
              "runAsNonRoot": true,
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "seccompProfile": {
                "type": "RuntimeDefault"
              },
              "runAsUser": 999
            },
            "resources": {
              "requests": {
                "cpu": "250m",
                "memory": "256Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "1Gi"
              }
            },
            "ports": [
              {
                "containerPort": 27017
              }
            ],
            "env": [
              {
                "name": "HOME",
                "value": "/tmp"
              },
              {
                "name": "MONGO_DATABASE",
                "value": "tienda"
              },
              {
                "name": "MONGO_INITDB_ROOT_USERNAME",
                "value": "tienda_owner"
              },
              {
                "name": "MONGO_INITDB_ROOT_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "tienda-secrets",
                    "key": "MONGO_OWNER_PASSWORD"
                  }
                }
              },
              {
                "name": "MONGO_APP_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "tienda-secrets",
                    "key": "MONGO_APP_PASSWORD"
                  }
                }
              }
            ],
            "readinessProbe": {
              "tcpSocket": {
                "port": 27017
              },
              "initialDelaySeconds": 10
            },
            "startupProbe": {
              "tcpSocket": {
                "port": 27017
              },
              "periodSeconds": 5,
              "failureThreshold": 60
            },
            "livenessProbe": {
              "tcpSocket": {
                "port": 27017
              },
              "initialDelaySeconds": 30,
              "periodSeconds": 15
            },
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/data/db"
              },
              {
                "name": "init",
                "mountPath": "/docker-entrypoint-initdb.d/10-app.js",
                "subPath": "mongo.js",
                "readOnly": true
              },
              {
                "name": "tmp",
                "mountPath": "/tmp"
              },
              {
                "name": "runtime",
                "mountPath": "/data/configdb"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "init",
            "configMap": {
              "name": "database-init",
              "defaultMode": 365
            }
          },
          {
            "name": "tmp",
            "emptyDir": {}
          },
          {
            "name": "runtime",
            "emptyDir": {}
          }
        ]
      }
    },
    "volumeClaimTemplates": [
      {
        "metadata": {
          "name": "data"
        },
        "spec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "resources": {
            "requests": {
              "storage": "5Gi"
            }
          }
        }
      }
    ]
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "mongo"
  },
  "spec": {
    "selector": {
      "app": "mongo"
    },
    "ports": [
      {
        "port": 27017,
        "targetPort": 27017
      }
    ]
  }
}
---
{
  "apiVersion": "batch/v1",
  "kind": "CronJob",
  "metadata": {
    "name": "vencer-pedidos"
  },
  "spec": {
    "schedule": "* * * * *",
    "concurrencyPolicy": "Forbid",
    "startingDeadlineSeconds": 60,
    "successfulJobsHistoryLimit": 1,
    "failedJobsHistoryLimit": 2,
    "jobTemplate": {
      "spec": {
        "backoffLimit": 2,
        "activeDeadlineSeconds": 50,
        "template": {
          "metadata": {
            "labels": {
              "app": "worker"
            }
          },
          "spec": {
            "serviceAccountName": "tienda",
            "automountServiceAccountToken": false,
            "securityContext": {
              "fsGroup": 33,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "containers": [
              {
                "name": "vencer-pedidos",
                "image": "tienda-backend:0.1.1",
                "imagePullPolicy": "IfNotPresent",
                "securityContext": {
                  "runAsNonRoot": true,
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  },
                  "seccompProfile": {
                    "type": "RuntimeDefault"
                  },
                  "runAsUser": 33
                },
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "512Mi"
                  }
                },
                "envFrom": [
                  {
                    "configMapRef": {
                      "name": "tienda-config"
                    }
                  }
                ],
                "env": [
                  {
                    "name": "DB_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "tienda-secrets",
                        "key": "DB_PASSWORD"
                      }
                    }
                  },
                  {
                    "name": "MONGO_URI",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "tienda-secrets",
                        "key": "MONGO_URI"
                      }
                    }
                  },
                  {
                    "name": "APP_ENCRYPTION_KEY",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "tienda-secrets",
                        "key": "APP_ENCRYPTION_KEY"
                      }
                    }
                  }
                ],
                "command": [
                  "php",
                  "bin/tienda.php",
                  "expire"
                ],
                "volumeMounts": [
                  {
                    "name": "tmp",
                    "mountPath": "/tmp"
                  }
                ]
              }
            ],
            "restartPolicy": "OnFailure",
            "volumes": [
              {
                "name": "tmp",
                "emptyDir": {}
              }
            ]
          }
        }
      }
    }
  }
}
