# Configuración de laboratorio para una sola laptop.
grafana:
  enabled: true
  persistence:
    enabled: true
    storageClassName: csi-hostpath-sc
    accessModes: [ReadWriteOnce]
    size: 1Gi
  initChownData:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 24h
    retentionSize: 512MB
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: '1'
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: csi-hostpath-sc
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: csi-hostpath-sc
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Estos endpoints del control plane no están expuestos para scrape en este laboratorio.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
