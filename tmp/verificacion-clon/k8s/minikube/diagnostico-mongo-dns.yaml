{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "namespace": "tienda-prod",
    "name": "diagnostico-mongo-dns",
    "labels": {
      "app": "migration"
    }
  },
  "spec": {
    "serviceAccountName": "tienda",
    "automountServiceAccountToken": false,
    "securityContext": {
      "fsGroup": 33,
      "seccompProfile": {
        "type": "RuntimeDefault"
      }
    },
    "containers": [
      {
        "name": "diagnostico",
        "image": "tienda-backend:0.1.0",
        "imagePullPolicy": "IfNotPresent",
        "securityContext": {
          "runAsNonRoot": true,
          "allowPrivilegeEscalation": false,
          "readOnlyRootFilesystem": true,
          "capabilities": {
            "drop": [
              "ALL"
            ]
          },
          "seccompProfile": {
            "type": "RuntimeDefault"
          },
          "runAsUser": 33
        },
        "resources": {
          "requests": {
            "cpu": "100m",
            "memory": "128Mi"
          },
          "limits": {
            "cpu": "1",
            "memory": "512Mi"
          }
        },
        "envFrom": [
          {
            "configMapRef": {
              "name": "tienda-config"
            }
          }
        ],
        "env": [
          {
            "name": "MONGO_URI",
            "valueFrom": {
              "secretKeyRef": {
                "name": "tienda-secrets",
                "key": "MONGO_OWNER_URI"
              }
            }
          },
          {
            "name": "MONGO_OWNER_PASSWORD",
            "valueFrom": {
              "secretKeyRef": {
                "name": "tienda-secrets",
                "key": "MONGO_OWNER_PASSWORD"
              }
            }
          }
        ],
        "command": [
          "php",
          "-r",
          "$uri=getenv('MONGO_URI');\n$ip=gethostbyname('mongo');\n$targets=['FQDN'=>'mongo.tienda-prod.svc.cluster.local.','IP temporal'=>$ip];\nforeach($targets as $label=>$host){\n echo 'Prueba '.$label.PHP_EOL;\n $test=preg_replace('/@mongo(?=:|\\/)/','@'.$host,$uri,1);\n try{\n  $m=new MongoDB\\Driver\\Manager($test,['serverSelectionTimeoutMS'=>15000,'connectTimeoutMS'=>5000]);\n  $m->executeCommand('admin',new MongoDB\\Driver\\Command(['ping'=>1]));\n  echo 'Conexion autenticada: OK'.PHP_EOL;\n }catch(Throwable $e){\n  $msg=str_replace([$uri,$test,getenv('MONGO_OWNER_PASSWORD')], '[OCULTO]', $e->getMessage());\n  $msg=preg_replace('~mongodb(?:\\+srv)?://[^\\s]+~','[URI OCULTA]',$msg);\n  echo 'FALLO: '.$msg.PHP_EOL;\n }\n}"
        ],
        "volumeMounts": [
          {
            "name": "tmp",
            "mountPath": "/tmp"
          }
        ]
      }
    ],
    "restartPolicy": "Never",
    "volumes": [
      {
        "name": "tmp",
        "emptyDir": {}
      }
    ]
  }
}