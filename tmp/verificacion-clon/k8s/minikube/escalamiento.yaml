{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "autoscaling/v2",
      "kind": "HorizontalPodAutoscaler",
      "metadata": {
        "name": "backend",
        "namespace": "tienda-prod"
      },
      "spec": {
        "scaleTargetRef": {
          "apiVersion": "apps/v1",
          "kind": "Deployment",
          "name": "backend"
        },
        "minReplicas": 2,
        "maxReplicas": 6,
        "metrics": [
          {
            "type": "Resource",
            "resource": {
              "name": "cpu",
              "target": {
                "type": "Utilization",
                "averageUtilization": 70
              }
            }
          }
        ]
      }
    },
    {
      "apiVersion": "policy/v1",
      "kind": "PodDisruptionBudget",
      "metadata": {
        "name": "frontend",
        "namespace": "tienda-prod"
      },
      "spec": {
        "minAvailable": 1,
        "selector": {
          "matchLabels": {
            "app": "frontend"
          }
        }
      }
    },
    {
      "apiVersion": "policy/v1",
      "kind": "PodDisruptionBudget",
      "metadata": {
        "name": "backend",
        "namespace": "tienda-prod"
      },
      "spec": {
        "minAvailable": 1,
        "selector": {
          "matchLabels": {
            "app": "backend"
          }
        }
      }
    },
    {
      "apiVersion": "autoscaling/v2",
      "kind": "HorizontalPodAutoscaler",
      "metadata": {
        "name": "frontend",
        "namespace": "tienda-prod"
      },
      "spec": {
        "scaleTargetRef": {
          "apiVersion": "apps/v1",
          "kind": "Deployment",
          "name": "frontend"
        },
        "minReplicas": 2,
        "maxReplicas": 6,
        "metrics": [
          {
            "type": "Resource",
            "resource": {
              "name": "cpu",
              "target": {
                "type": "Utilization",
                "averageUtilization": 70
              }
            }
          }
        ]
      }
    }
  ]
}