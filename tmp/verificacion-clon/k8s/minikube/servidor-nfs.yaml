# Servidor de archivos del laboratorio; la aplicación conserva PSA restricted.
apiVersion: v1
kind: Namespace
metadata:
  name: tienda-storage
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-datos
  namespace: tienda-storage
spec:
  storageClassName: csi-hostpath-sc
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nfs-config
  namespace: tienda-storage
data:
  ganesha.conf: |
    NFS_CORE_PARAM {
      Protocols = 4;
      Enable_UDP = false;
      Enable_NLM = false;
      Enable_RQUOTA = false;
    }
    EXPORT {
      Export_Id = 1;
      Path = /export/uploads;
      Pseudo = /uploads;
      Access_Type = RW;
      Squash = Root_Squash;
      Anonymous_uid = 33;
      Anonymous_gid = 33;
      SecType = sys;
      Protocols = 4;
      Transports = TCP;
      FSAL {
        Name = VFS;
      }
    }
    LOG {
      Default_Log_Level = WARN;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  namespace: tienda-storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nfs-server
  template:
    metadata:
      labels:
        app: nfs-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nfs
          image: ghcr.io/kubernetes-sigs/nfs-ganesha:V6.5
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /export/uploads /usr/local/var/run/ganesha /run/dbus /run/rpcbind
              chown 33:33 /export/uploads
              chmod 2770 /export/uploads
              dbus-daemon --system --fork
              rpcbind -w
              exec /usr/local/bin/ganesha.nfsd -F -L STDOUT -f /etc/ganesha/ganesha.conf
          securityContext:
            runAsUser: 0
            capabilities:
              add: [DAC_READ_SEARCH, SYS_RESOURCE]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          ports:
            - name: nfs
              containerPort: 2049
          startupProbe:
            tcpSocket:
              port: nfs
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: nfs
            periodSeconds: 10
          volumeMounts:
            - name: datos
              mountPath: /export
            - name: configuracion
              mountPath: /etc/ganesha/ganesha.conf
              subPath: ganesha.conf
              readOnly: true
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: nfs-datos
        - name: configuracion
          configMap:
            name: nfs-config
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: tienda-storage
spec:
  type: ClusterIP
  selector:
    app: nfs-server
  ports:
    - name: nfs
      port: 2049
      targetPort: nfs
      protocol: TCP
