# Socket local para administracion dentro del Pod; conserva el mecanismo existente.
local all all trust
# TCP solo cifrado, con contrasena SCRAM. NetworkPolicy limita los origenes.
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
hostssl all all 0.0.0.0/0 scram-sha-256
hostssl all all ::/0 scram-sha-256
