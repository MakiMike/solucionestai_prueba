apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tienda
  namespace: tienda-prod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - tienda-prod.test
      secretName: tienda-tls
    - hosts:
        - tskull-shirt.test
      secretName: tienda-tls
  rules:
    - host: tskull-shirt.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
    - host: tienda-prod.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
